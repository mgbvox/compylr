[package]
name = "compylr"
version = "0.1.0"
edition = "2024"

# `cdylib` builds the `compylr._core` extension module; `rlib` keeps the binary and the
# integration tests able to link against the same crate. Dropping `rlib` would leave
# `cargo test` unable to see the library at all.
[lib]
name = "compylr"
crate-type = ["cdylib", "rlib"]

[dependencies]
ruff_python_ast = { version = "0.0.0", path = "vendored/ruff/crates/ruff_python_ast" }
ruff_python_parser = { version = "0.0.0", path = "vendored/ruff/crates/ruff_python_parser" }
ruff_source_file = { version = "0.0.0", path = "vendored/ruff/crates/ruff_source_file" }
ruff_text_size = { version = "0.0.0", path = "vendored/ruff/crates/ruff_text_size" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
pyo3 = { version = "0.29.2", features = ["abi3-py311"] }

# `extension-module` tells PyO3 not to link libpython, which is required when building a
# wheel but breaks `cargo test`: the test binary needs those symbols resolved. Keeping it
# optional lets maturin turn it on without making the test suite unbuildable.
[features]
extension-module = ["pyo3/extension-module"]

[dev-dependencies]
insta = "1.35.1"
