# A virtual manifest: the root is a workspace and nothing else. No language's crate sits above the
# others, and the dependency edges between the members are the enforcement mechanism for keeping
# languages out of shared code -- a crate that does not depend on ruff cannot grow a Python
# spelling, and `crates/compylr-host-python/tests/crate_boundaries.rs` fails when an edge appears
# that would make that false.
[workspace]
resolver = "3"
members = ["crates/*"]
# `vendored/ruff` is a submodule with its own workspace, and the generated crates under
# `.compylr/` are build output that happens to contain a manifest. Both sit inside this
# directory, so cargo would otherwise adopt them as members and try to inherit workspace
# settings they never declared.
exclude = ["vendored", ".compylr", "demo"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
compylr-diagnostics = { path = "crates/compylr-diagnostics" }
compylr-ir = { path = "crates/compylr-ir" }
compylr-core = { path = "crates/compylr-core" }
compylr-frontend-python = { path = "crates/compylr-frontend-python" }
compylr-backend-rust = { path = "crates/compylr-backend-rust" }
compylr-bridge-python-rust = { path = "crates/compylr-bridge-python-rust" }
compylr-registry = { path = "crates/compylr-registry" }
compylr = { path = "crates/compylr-host-python" }

ruff_python_ast = { version = "0.0.0", path = "vendored/ruff/crates/ruff_python_ast" }
ruff_python_parser = { version = "0.0.0", path = "vendored/ruff/crates/ruff_python_parser" }
ruff_source_file = { version = "0.0.0", path = "vendored/ruff/crates/ruff_source_file" }
ruff_text_size = { version = "0.0.0", path = "vendored/ruff/crates/ruff_text_size" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
pyo3 = { version = "0.29.2", features = ["abi3-py311"] }
