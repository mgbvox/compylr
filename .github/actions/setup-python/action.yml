name: Set up Python
description: >
  Install uv, set up Python with the specified version, and enable uv cache.

inputs:
  python-version:
    description: "Python version (e.g. '3.12')"
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
