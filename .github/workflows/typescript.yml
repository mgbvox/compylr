name: TypeScript

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: typescript-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    name: tsc and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-typescript
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: demo-ts
        run: npm ci || npm install
      - name: Type-check demo
        working-directory: demo-ts
        run: npx tsc --noEmit

  test:
    name: node test (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "23", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-typescript
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        working-directory: demo-ts
        run: npm ci || npm install
      - name: Run test suite
        working-directory: demo-ts
        run: npm test

  demo:
    name: demo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-typescript
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-golang
        with:
          go-version: "1.23"

      - name: Install demo dependencies
        working-directory: demo-ts
        run: npm ci || npm install

      - name: Precompile demo algorithms to Go
        run: |
          cargo run -p compylr-cli -- \
            --frontend typescript \
            --backend go \
            --emit crate \
            --out demo-ts/.compylr/go \
            demo-ts/src/algorithms/sorting.ts \
            demo-ts/src/algorithms/arithmetic.ts \
            demo-ts/src/algorithms/stats.ts \
            demo-ts/src/algorithms/text.ts \
            demo-ts/src/algorithms/graphs.ts \
            demo-ts/src/algorithms/dynamic.ts \
            demo-ts/src/algorithms/matrices.ts \
            demo-ts/src/algorithms/structures.ts \
            demo-ts/src/algorithms/nth_prime/recursive.ts \
            demo-ts/src/algorithms/nth_prime/iterative.ts \
            demo-ts/src/algorithms/nth_prime/memoized.ts

      - name: Build Go shared library
        working-directory: demo-ts/.compylr/go
        run: go build -buildmode=c-shared -o ../lib/compylr_generated_demo.so .

      - name: Run every algorithm and verify IR coverage
        working-directory: demo-ts
        run: npm start

      - name: Run nth prime benchmarks
        working-directory: demo-ts
        run: node --experimental-strip-types src/algorithms/nth_prime/benchmark.ts

      - name: Run full test suite
        working-directory: demo-ts
        run: npm test

      - name: Type check demo sources
        working-directory: demo-ts
        run: npx tsc --noEmit
