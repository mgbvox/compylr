[project]
name = "compylr-demo"
version = "0.1.0"
description = "A worked compylr project: three nth-prime variants, and common algorithms"
requires-python = ">=3.12"
dependencies = ["compylr"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "ty>=0.0.74"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algorithms"]

# compylr is consumed from the parent checkout rather than from an index, so the demo exercises
# whatever is actually in this repository rather than the last release.
[tool.uv.sources]
compylr = { path = "..", editable = true }

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
# `.compylr/` is build output -- a generated crate and the IR it came from, not source anyone
# wrote. `src/algorithms` is the project; `tests/` is checked with it.
exclude = [".compylr"]
