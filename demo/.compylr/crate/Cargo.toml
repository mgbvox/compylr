[workspace]

[package]
name = "compylr_generated_ef5b5f0fa0049bdd_a0cdd1db"
version = "0.1.0"
edition = "2024"

[lib]
name = "compylr_generated_ef5b5f0fa0049bdd_a0cdd1db"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["abi3-py311", "extension-module"] }

# Declared, not inherited. The runtime helpers are emitted into a different module from
# the code that calls them, and at Cargo's default of sixteen codegen units they are
# frequently not inlined — which matters here in particular because every arithmetic
# operation in the supported subset is a trait call by design.
#
# `panic` is stated rather than left to default: the bridge turns a panic into a Python
# exception, and aborting would terminate the interpreter instead.
#
# No `target-cpu`. It was measured and moved no row outside the benchmark's noise floor,
# and a generated crate may be copied to a machine whose CPU lacks the instructions it
# was built for. A slower artifact beats one that faults.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
