name: compylr-schema-main
version: 2
description: >-
  compylr's spec-driven workflow - proposal → specs → design → tasks, with a worked code
  example in the proposal, a code snippet under every design decision, IR shown as IR, and
  Gherkin-translatable scenarios. Citations are relative links that resolve locally and on GitHub.
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Worked Example**: ONE example, as code, that exercises everything this change adds or alters. Rules below.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<capability-path>/spec.md`. Use kebab-case for path segments you introduce (e.g., `user-auth` or `identity/user-auth`) and follow the project's existing spec organization.
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Use the exact existing path under `openspec/specs/`. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      ## The worked example

      compylr is a transpiler. Every change is ultimately visible as source going in and
      something different coming out, so prose about it is a claim and the code is the
      evidence. A proposal therefore carries exactly ONE worked example, and it earns its
      place by covering the whole change: a reader who reads only that section should be
      able to say what this change does.

      Show the stages the change actually touches, in pipeline order, each as a fenced
      block with a language tag:

        1. **Input** - the source program, in the frontend language, written so the subset
           described in the project context would accept it. Under ~20 lines.
        2. **Today** - what that program does now: the current answer, the current
           diagnostic, the current generated code, or the current command output. Omit only
           when the change adds a form that has no behavior today at all, and say that.
        3. **After** - what it does once this change lands.
        4. **At the boundary** - when the change is observable from the host language, the
           call and its answer, as a transcript.

      Include the IR and the generated target source here only where the change moves them,
      and only the lines that move: the proposal shows the change's FACE, and design.md is
      where the IR gets dissected.

      Rules for the example:
        - **One example.** If a single program genuinely cannot reach every changed
          behavior, add the fewest extra snippets that do and give each a one-line reason it
          has to be separate. Three snippets that could have been one usually means the
          change is doing three things.
        - **Real code, not schematic.** `def add(a: int, b: int) -> int`, not
          `def f(x: T) -> U`. Concrete values, so a reader can check the answer themselves.
        - **Never invent output.** If you have not run it, mark it `# expected` and say so.
          A fabricated transcript is worse than no transcript.
        - **A rejection is behavior.** Where the change adds or moves a diagnostic, the
          example's output IS the diagnostic, quoted exactly, span included.
        - **Write it so it can be lifted.** An accepted example usually becomes a fixture in
          `frontends/<language>/fixtures/accepted/` with a driver beside it; a rejected one
          becomes a fixture in `rejected/`. Write it in that form now and the tasks phase
          gets to move a file rather than invent a program.
        - **Keep `#` out of column zero.** `openspec show` reads the first line beginning
          with `# ` as the change's title and does not skip code fences, so a top-of-file
          comment in a Python example becomes the change's name in `openspec list`. Indent
          comments inside a body, or leave them out.

      ## Citing code

      Cite code with a RELATIVE link carrying a line anchor, so it resolves in an editor and
      on GitHub both:

          [`Unit::fingerprint`](../../../crates/compylr-ir/src/ir.rs#L1299)

        - **Relative to the artifact's own directory.** `proposal.md`, `design.md`, and
          `tasks.md` sit at `openspec/changes/<change-id>/`, so the repository root is
          `../../../`. A delta spec at
          `openspec/changes/<change-id>/specs/<capability-path>/spec.md` is two levels
          deeper: `../../../../../`. Count the segments; do not guess.
        - **Line anchors are GitHub's**: `#L1299` for a line, `#L1299-L1310` for a range.
          Editors that resolve line fragments honor them and ones that do not ignore them.
        - **Link text is the identifier, not the path** - `Unit::fingerprint`, not
          `crates/compylr-ir/src/ir.rs`. Line numbers drift; a name stays findable.
        - **Never** an absolute path, a `file://` URL, or an `https://github.com/...`
          permalink. The first two break for everyone else, and the third pins a commit and
          is dead locally.
        - **Link every crate, module, type, function, test, or fixture the first time it is
          named.** A path in prose that is not a link is a path nobody can follow.
        - Cite instead of restating. The accepted subset and its reasoning live in
          `CLAUDE.md`; link to it rather than paraphrasing it into the proposal.
        - Archiving moves the change one level deeper -
          `openspec/changes/archive/<date>-<change-id>/` - so these links resolve one level
          short once archived. That is accepted: the artifacts record the change as it was
          made, and the live document is the one people follow links in.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Research existing specs before filling this in.
      Each capability listed here will need a corresponding spec file.

      Every change must either declare at least one capability (new or
      modified) or explicitly opt out of specs: `openspec validate` rejects a
      change with zero deltas unless the change's `.openspec.yaml` sets
      `skip_specs: true`. Use `skip_specs: true` only when no spec-level
      behavior changes (pure refactor, tooling, docs) - specs describe
      behavior, so if behavior does not change, no spec should change either.
      Do not invent a requirement just to satisfy validation.

      Keep it concise (1-2 pages, the worked example included). Focus on the "why" not the
      "how" - implementation details belong in design.md.

      This is the foundation - specs, design, and tasks all build on this.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      A spec is a behavior contract, not an implementation plan.

      Good spec content:
      - Observable behavior users or downstream systems rely on
      - Inputs, outputs, and error conditions
      - External constraints (security, privacy, reliability, compatibility)
      - Scenarios that can be tested or explicitly validated

      Avoid in specs:
      - Internal class/function names
      - Library or framework choices
      - Step-by-step implementation details
      - Detailed execution plans (those belong in design.md or tasks.md)

      Quick test: if the implementation can change without changing externally
      visible behavior, it likely does not belong in the spec.

      Create one spec file per capability listed in the proposal's Capabilities section.
      `<capability-path>` is the spec directory relative to `specs/` (for example,
      `user-auth` or `identity/user-auth`). Preserve the full path:
      - New capabilities: use the exact path from the proposal at `specs/<capability-path>/spec.md`. Any path segment newly introduced in the proposal must be kebab-case. Follow the project's existing organization; do not add a new domain level when the project uses a flat layout.
      - Modified capabilities: use the exact existing path from `openspec/specs/<capability-path>/` when creating the delta at `specs/<capability-path>/spec.md`. Do not move or rename the capability.

      There must be at least one spec file unless the change's `.openspec.yaml`
      sets `skip_specs: true` (no spec-level behavior change) - `openspec validate`
      rejects a zero-delta change without that marker. If the proposal lists no
      capabilities and `skip_specs` is not set, revisit the proposal first.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with Gherkin GIVEN/WHEN/THEN steps
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.

      ## Scenarios are Gherkin

      A spec file is a Gherkin feature wearing markdown. The capability is the `Feature`,
      each `### Requirement:` is a `Rule:`, and each `#### Scenario:` is a `Scenario:` whose
      bullets are steps. **Strip the markdown decoration and what is left must be a valid
      `.feature` body** - that is the test for whether a scenario is written correctly, and
      it is what makes these specs automatable later rather than only readable.

      Steps, in this order, one keyword per bullet, bolded:

        - `- **GIVEN** <the state of the world beforehand>` - preconditions that put the
          system in a known state. A second one continues with `**AND**`. Omit `GIVEN` only
          when there genuinely is no precondition.
        - `- **WHEN** <the one thing that happens>` - **exactly one per scenario.** A second
          `WHEN` is a second scenario. Two actions joined by "and" is a conjunctive step:
          split it, or the scenario has two reasons to fail.
        - `- **THEN** <what is then observably true>` - the outcome, as an assertion. More
          continue with `**AND**`; a contrast uses `**BUT**`.
        - `**AND**` and `**BUT**` inherit the type of the step above them, so a scenario
          never opens with one.

      The Gherkin rules that matter most here:

        - **Describe behavior, not implementation.** A scenario says what compylr accepts,
          rejects, emits, or answers - never which function does it. If the internals could
          be rewritten without touching the scenario, it is at the right level.
        - **Declarative over imperative.** "WHEN the unit is compiled for the `rust`
          backend", not a transcript of the steps a build performs.
        - **One behavior per scenario**, and name the scenario for that behavior:
          `#### Scenario: A zero step is rejected before the loop runs`, not
          `#### Scenario: Range`.
        - **Observable outcomes only.** A `THEN` names what a caller, a reader of the
          generated source, or a diagnostic can see - not the value of an internal field.
        - **Ubiquitous language.** Use the project's own words - unit, lowering, frontend,
          backend, bridge, guarantee, behavior, fingerprint - so a scenario and the code
          it governs say the same thing.

      **Concrete examples beat descriptions**, and compylr's subject matter IS code, so a
      step may carry a code block - Gherkin's doc string. Fence it, tag it, and indent it
      under its step:

      ````
      #### Scenario: An unannotated parameter is refused with its span
      - **GIVEN** a module whose only function is

        ```python
        def add(a, b: int) -> int:
            return a + b
        ```

      - **WHEN** the module is lowered by the `python` frontend
      - **THEN** lowering fails
      - **AND** the diagnostic names the parameter `a` and points at line 1
      ````

      **One behavior over a set of inputs is a `Scenario Outline`.** When the same rule holds
      across the semantic axes, the types, or the backends, write it once with
      `<placeholders>` and follow it with an `Examples:` table rather than copying the
      scenario per row:

      ```
      #### Scenario Outline: Integer division rounds as the resolved behavior declares
      - **GIVEN** a unit whose behavior resolves integer division to <rounding>
      - **WHEN** `<expression>` is emitted for the `rust` backend and run
      - **THEN** the result is `<result>`

      **Examples:**

      | rounding | expression | result |
      | -------- | ---------- | ------ |
      | Floor    | `-7 // 2`  | `-4`   |
      | Trunc    | `-7 // 2`  | `-3`   |
      ```

      A `Scenario Outline` still needs its `####` header to be counted as a scenario, and
      the `Examples:` table belongs inside that same scenario block.

      Never assert on something the language deliberately does not promise. Mapping and set
      iteration order is the standing example: a scenario that pins it is asserting behavior
      the subset does not provide, and it will be flaky rather than the compiler being wrong.

      ## Citing code

      Cite code with a RELATIVE link carrying a line anchor, so it resolves in an editor and
      on GitHub both. A delta spec sits at
      `openspec/changes/<change-id>/specs/<capability-path>/spec.md`, so the repository root
      is FIVE levels up:

          [`Expr::Subscript`](../../../../../crates/compylr-ir/src/ir.rs#L441)

        - Line anchors are GitHub's: `#L441` for a line, `#L441-L470` for a range.
        - Link text is the identifier, not the path. Line numbers drift; a name stays
          findable.
        - Never an absolute path, a `file://` URL, or an `https://github.com/...` permalink.
        - Keep citations in requirement prose, not inside scenario steps: a step that names
          a source file has stopped describing behavior.
        - Archiving moves the change one level deeper -
          `openspec/changes/archive/<date>-<change-id>/` - so these links resolve one level
          short once archived. That is accepted: the artifacts record the change as it was
          made, and the live document is the one people follow links in.

      New capabilities only: start the delta spec with a `## Purpose` section -
      one or two sentences (50+ characters, or `openspec validate --strict`
      reports it as too brief) describing what the capability is for. Archive
      copies it into the main spec it creates; without it the new main spec is
      left with a `TBD ... Update Purpose after archive` placeholder to fill in
      by hand. Do NOT add `## Purpose` to a delta for an existing capability -
      that spec already has one and the delta's is ignored. To change an
      existing capability's Purpose - including a leftover `TBD` placeholder -
      edit `openspec/specs/<capability-path>/spec.md` directly.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in openspec/specs/<capability-path>/spec.md
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Existing main specs predate the Gherkin form and open at `**WHEN**` with no `GIVEN`.
      That is still valid Gherkin, so do not rewrite a requirement's untouched scenarios
      into the new form as a side effect: when you copy a block under MODIFIED, bring the
      scenarios you are actually changing up to GIVEN/WHEN/THEN and leave the rest as they
      are. A mass rewrite of scenario syntax is its own change.

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example (a new capability, so it opens with `## Purpose`):
      ```
      ## Purpose

      Lets users take their data out of the product in a portable format.

      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Export of a populated account
      - **GIVEN** a signed-in user whose account holds at least one record
      - **WHEN** the user requests an export
      - **THEN** a CSV file is downloaded
      - **AND** it contains one row per record the account holds

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      Specs should be testable - each scenario is a potential test case, and in this form
      each is a Gherkin scenario that could be executed as one.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.

      When to include design.md (create only if any apply):
      - Cross-cutting change (multiple services/modules) or new architectural pattern
      - New external dependency or significant data model changes
      - Security, performance, or migration complexity
      - Ambiguity that benefits from technical decisions before coding

      Sections:
      - **Context**: Only the current state and constraints needed to explain the approach. Reference the proposal for motivation instead of restating it (e.g., "See proposal.md - Why").
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes. Don't restate the proposal's scope - add only design-level boundaries.
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered for each decision.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)
      - **Open Questions**: Unknowns that can safely be answered later without
        changing the specs, the approach, or the task breakdown. Omit if none.

      Open questions are for genuinely deferrable unknowns, not decisions you
      skipped. If a question would change the specs, the chosen approach, or
      the task breakdown, resolve it now - ask the user instead of guessing.

      ## Every decision shows its face in code

      compylr is a transpiler, so a decision about it is a decision about a type, a match
      arm, a call site, or emitted text. Write decisions as numbered blocks -
      `### N. <the decision, as a sentence>` - each carrying **Decision**, a snippet, **Why**,
      and **Alternatives considered**. The snippet goes right after **Decision**, and it is
      the smallest form that makes the choice concrete:

        - the type or signature the change adds or changes,
        - the arm that dispatches on it,
        - the call site as it would then read, or
        - the target source that comes out.

      Keep snippets under ~15 lines, elide the uninteresting parts with `// ...`, and tag
      every fence with a language (`rust`, `python`, `typescript`, `go`, `json`, `text`).
      Where the decision changes something that already exists, show both sides:

      ```rust
      // before - one subscript form, Python's semantics assumed
      Subscript { value: Box<Expr>, index: Box<Expr> },
      // after - the origin and the checking mode travel with the operation
      Subscript { value: Box<Expr>, index: Box<Expr>, origin: IndexOrigin, checked: Checked },
      ```

      A decision with no code face - a sequencing call, a naming convention, a choice about
      process - says so in one line rather than growing a snippet to fill the slot. A
      snippet that only restates the prose is worse than none.

      Prefer showing the shape over describing it. "The pass runs over a copy" is a claim;
      three lines of the signature that takes `&Unit` and returns `Unit` is the design.

      ## A decision that touches the IR shows the IR

      Two forms, and a decision that changes the IR owes both:

      **1. The definition delta**, as Rust, against `compylr-ir` - the `before`/`after` form
      above.

      **2. The value, for the worked example's program**, as the JSON `--emit ir` writes -
      which is the same JSON a user finds under `.compylr/`. Trim it to the nodes that move
      and mark what you trimmed:

      ```json
      {
        "version": 4,
        "functions": [
          {
            "name": "add",
            "params": [{ "name": "a", "ty": "Int" }, { "name": "b", "ty": "Int" }],
            "ret": "Int",
            "body": [
              { "Return": { "Binary": { "op": { "Add": { "checked": "Reported" } },
                                        "left": { "Name": "a" },
                                        "right": { "Name": "b" } } } }
            ]
          }
        ],
        "origin": { "frontend": "python", "requires": ["IntegerOverflowReported", "FloatOrderPreserved"] }
      }
      ```

      Get the real JSON rather than writing it from memory:

      ```bash
      cargo run -p compylr-cli -- --emit ir  path/to/example.py
      cargo run -p compylr-cli -- --emit rust path/to/example.py
      ```

      Then answer the questions an IR change always raises, in the decision itself or under
      Risks:

        - **Neutrality.** Nothing added to the IR may name a source or target language. If
          the new form only makes sense for one language, it belongs in that frontend or
          backend, and the crate boundary test will say so.
        - **Mode or form?** A difference in the SEMANTICS of an operation is a mode on the
          existing form; a difference in its SHAPE is a distinct form. Say which this is and
          why - getting it backwards is the recurring IR design mistake.
        - **Format version.** Does the artifact's `version` move? Every cached build is
          invalidated once when it does, so say it here rather than letting a user discover
          it as a slow first run.
        - **Fingerprint.** Does the new shape change what `Unit::fingerprint()` covers?
          Fingerprints are taken pre-pass and exclude spans and docstrings; state which side
          of that line the addition falls on.
        - **Coverage.** An added IR form trips the demo coverage test, so it needs either an
          algorithm in the demo that uses it or a narrowed claim in the demo README. Name
          which, here, so tasks can schedule it.

      ## Citing code

      Cite code with a RELATIVE link carrying a line anchor, so it resolves in an editor and
      on GitHub both. `design.md` sits at `openspec/changes/<change-id>/`, so the repository
      root is `../../../`:

          [`Unit::fingerprint`](../../../crates/compylr-ir/src/ir.rs#L1299)
          [`crate_boundaries.rs`](../../../crates/compylr-host-python/tests/crate_boundaries.rs)

        - Line anchors are GitHub's: `#L1299` for a line, `#L1299-L1310` for a range.
        - Link text is the identifier, not the path. Line numbers drift; a name stays
          findable.
        - Never an absolute path, a `file://` URL, or an `https://github.com/...` permalink.
        - Link every crate, module, type, function, test, or fixture the first time it is
          named. Anchor a `before` snippet to the line it was copied from, so a reviewer can
          check that it is still what the file says.
        - Cite instead of restating: `CLAUDE.md` carries the subset and its reasoning, and
          the main specs carry the requirements. Point at them.
        - Archiving moves the change one level deeper -
          `openspec/changes/archive/<date>-<change-id>/` - so these links resolve one level
          short once archived. That is accepted: the artifacts record the change as it was
          made, and the live document is the one people follow links in.

      Focus on architecture and approach, not line-by-line implementation - a snippet is
      there to make a decision concrete, not to be the patch. The proposal covers why and
      what; design covers how. Reference the proposal for motivation and, once written, the
      specs for requirements - if a section would only restate them, point to them instead.

      Good design docs explain the "why" behind technical decisions, and show what each one
      would look like.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      Before writing tasks, check design.md for Open Questions. If any of them
      would change what gets built, resolve them with the user first - do not
      bake an unstated assumption into the task list.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be tracked.

      Guidelines:
      - Group related tasks under ## numbered headings
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)

      compylr specifics:
      - **The test comes first.** A group that adds behavior opens with the task that writes
        the failing test, and the scenarios in `specs/` are what those tests assert.
      - **The worked example becomes a fixture.** Schedule moving the proposal's example into
        `frontends/<language>/fixtures/accepted/` (or `rejected/`) with its driver, as its own
        task. An accepted fixture without a driver fails the suite.
      - **Name the check that proves a task done.** `cargo test --workspace`, `make check`,
        `make demo`, `./scripts/update_subset.py --check` - a task nobody can verify is a task
        nobody can close.
      - A change that touches emission or the manager owes a `make demo` comparison task, and
        that task starts by removing `.compylr/`.
      - A change to the accepted subset owes a README task in the same change, not after it.

      Where a task names a file, link it relatively with a line anchor -
      `[Unit::fingerprint](../../../crates/compylr-ir/src/ir.rs#L1299)` - so it resolves both
      in an editor and on GitHub. `tasks.md` sits at `openspec/changes/<change-id>/`, so the
      repository root is `../../../`. No absolute paths, no `github.com` permalinks. Archiving
      moves the change a level deeper, so those links resolve one level short afterwards; the
      live document is the one people follow links in.

      Example:
      ```
      ## 1. IR

      - [ ] 1.1 Add the failing lowering test for the new form in [ir_lowering.rs](../../../crates/compylr-host-python/tests/control_flow_lowering.rs)
      - [ ] 1.2 Add the form to [`Expr`](../../../crates/compylr-ir/src/ir.rs#L441) and bump the artifact version

      ## 2. Backend

      - [ ] 2.1 Emit the new form from [`rust.rs`](../../../crates/compylr-backend-rust/src/rust.rs)
      - [ ] 2.2 Move the proposal's worked example into `frontends/python/fixtures/accepted/` with a driver
      ```

      Reference specs for what needs to be built, design for how to build it.
      Each task should be verifiable - you know when it's done.
    requires:
      - specs
      - design

apply:
  requires: [ tasks ]
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification.
