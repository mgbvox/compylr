[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "compylr"
description = "Transpiles a strict, fully annotated Python subset to Rust."
requires-python = ">=3.11"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "ty>=0.0.74",
    "pre-commit>=3.7",
    "maturin>=1.9,<2.0",
]

[project.scripts]
# The Python entry point. The Rust binary keeps its `--emit` surface and is reached through
# `cargo run` during compiler development -- see the README, because this changes what the name
# refers to for anyone who was invoking the binary directly.
compylr = "compylr._precompile:main"

[tool.maturin]
# Mixed layout: the Python package lives in `frontends/python/compylr`, and the compiled half of it is
# `compylr._core`. `frontends/python/fixtures` sits alongside but is not a package, so it is not packaged.
#
# The Rust half is `crates/compylr-host-python`, named for the job it does rather than for the
# project -- the workspace root is a virtual manifest and no language's crate sits above the
# others. Naming it here is what lets that be true.
manifest-path = "crates/compylr-host-python/Cargo.toml"
python-source = "frontends/python"
module-name = "compylr._core"
# Tells PyO3 not to link libpython, which is required for a wheel and would break `cargo test`.
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["frontends/python/tests"]
addopts = "--cov=compylr --cov-report=term-missing --cov-fail-under=80 -q"
markers = [
    "slow: compiles a Rust crate; minutes on a cold cache",
]

[tool.coverage.run]
omit = ["*/_core.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Applies the exclusions below even to a path named explicitly on the command line. Without this,
# `ruff check --fix frontends/python/fixtures/rejected/import_statement.py` lints a file that is invalid on
# purpose -- which is how the `import os` that fixture exists to test was once deleted.
force-exclude = true
# The fixtures are compiler inputs, not code: `rejected/` is deliberately invalid, and linting it
# would report exactly the problems it exists to contain. `frontends/python/fixtures/drivers/` is the
# exception and is deliberately *not* excluded -- a driver is ordinary Python that states which
# calls exercise a fixture, so it is held to the same standard as the rest of the tree.
extend-exclude = [
    "frontends/python/fixtures/accepted",
    "frontends/python/fixtures/rejected",
    "frontends/python/entrypoint.py",
    "vendored",
    "inspiration",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
# The floor from `requires-python`. Checking against the oldest supported version is the point:
# checking against the newest would accept syntax and stdlib a supported interpreter does not have.
python-version = "3.11"

[tool.ty.src]
# The accepted and rejected corpora are compiler *input*, and `rejected/` is deliberately invalid
# -- type-checking it would report exactly the errors it exists to contain, which is the same
# reason ruff excludes it. `frontends/python/fixtures/drivers/` is not input and is checked. `demos/` is its
# own project with its own configuration and is checked from there.
exclude = [
    "frontends/python/fixtures/accepted",
    "frontends/python/fixtures/rejected",
    "frontends/python/entrypoint.py",
    "vendored",
    "inspiration",
    "demo",
    "target",
    "worktrees",
]

[tool.ty.rules]
# The compiled half of the package has no source to read; `_core.pyi` is its declared surface, so
# an unresolved import there would be a missing stub rather than a missing module.
unresolved-import = "error"